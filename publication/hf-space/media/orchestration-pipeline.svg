<g font-size="11" fill="#a3b1bd"><text x="59" y="172">Actor · organisation · input snapshot</text><text x="59" y="189">Record versions · deadline · budget</text><text x="344" y="172">Qwen3-1.7B / pinned local weights</text><text x="344" y="189">Structured JSON proposal only</text><text x="639" y="172">Capability · role · dependencies</text><text x="639" y="189">Scope · resource limits · freshness</text><text x="639" y="474">Source / model / rule identities</text><text x="639" y="491">Input + output hashes · timestamps</text><text x="934" y="474">Needs Review / accountable preparer</text><text x="934" y="491">No automatic approval or dispatch</text></g>
