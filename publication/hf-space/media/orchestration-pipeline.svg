<title id="title">System Lab Airspace Operations: scoped agent execution</title><desc id="desc">A scoped task enters a local generative controller. Independent admission gates specialist tools. Actual source and computation results become versioned receipts, which supply the next-step context. Controlled artifacts require independent review. No aircraft or authority command path exists.</desc>
